name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/deploy-render.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run TypeScript build
        working-directory: ./backend
        run: npm run build

      - name: Run tests
        working-directory: ./backend
        run: npm test || true
        continue-on-error: true

      - name: Trigger Render Deployment
        run: |
          echo "Triggering Render deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for deployment
        run: |
          echo "Waiting 60 seconds for Render to deploy..."
          sleep 60

      - name: Verify deployment
        run: |
          echo "Testing backend health endpoint..."
          for i in {1..5}; do
            if curl -f "${{ secrets.BACKEND_URL }}/api/health"; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
          echo "❌ Backend health check failed after 5 attempts"
          exit 1

      - name: Test Swagger endpoint
        run: |
          echo "Testing Swagger documentation endpoint..."
          curl -f "${{ secrets.BACKEND_URL }}/api-docs.json" | jq -r '.info.title'
          echo "✅ Swagger docs are accessible!"

      - name: Deployment summary
        if: success()
        run: |
          echo "🎉 Deployment successful!"
          echo "Backend URL: ${{ secrets.BACKEND_URL }}"
          echo "Swagger Docs: ${{ secrets.BACKEND_URL }}/api-docs"
          echo "Health Check: ${{ secrets.BACKEND_URL }}/api/health"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check Render dashboard for deployment logs"
          echo "https://dashboard.render.com"
