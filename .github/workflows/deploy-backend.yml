name: Deploy Backend to Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Run tests
        working-directory: ./backend
        run: npm test || true
        continue-on-error: true

      - name: Trigger Render Deployment
        run: |
          echo "🚀 Triggering Render deployment via deploy hook..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Deployment triggered successfully!"

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting 90 seconds for Render to build and deploy..."
          sleep 90

      - name: Verify deployment health
        run: |
          echo "🔍 Testing backend health endpoint..."
          for i in {1..10}; do
            if curl -f "${{ secrets.BACKEND_URL }}/api/health"; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i/10 failed, retrying in 15 seconds..."
            sleep 15
          done
          echo "❌ Backend health check failed after 10 attempts"
          exit 1

      - name: Test Swagger endpoint
        run: |
          echo "📚 Testing Swagger documentation endpoint..."
          SWAGGER_TITLE=$(curl -f "${{ secrets.BACKEND_URL }}/api-docs.json" | jq -r '.info.title')
          echo "✅ Swagger docs accessible: $SWAGGER_TITLE"

      - name: Test Analytics endpoint
        run: |
          echo "📊 Testing analytics dashboard endpoint..."
          curl -f "${{ secrets.BACKEND_URL }}/api/analytics/dashboard?period=current-month" || echo "⚠️ Analytics endpoint returned error (may need auth)"

      - name: Deployment summary
        if: success()
        run: |
          echo "🎉 Deployment to Render successful!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Backend URL: ${{ secrets.BACKEND_URL }}"
          echo "Swagger Docs: ${{ secrets.BACKEND_URL }}/api-docs"
          echo "Health Check: ${{ secrets.BACKEND_URL }}/api/health"
          echo "Analytics API: ${{ secrets.BACKEND_URL }}/api/analytics"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment to Render failed!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Check Render dashboard for deployment logs:"
          echo "https://dashboard.render.com"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1
